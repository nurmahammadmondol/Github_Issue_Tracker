<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracker</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- Tailwind+daisyUI  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font awosame -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- login Section  -->
    <section class="w-3/4 md:w-1/3 mx-auto my-12 ">
      <div class="card bg-base-100  shrink-0 shadow-2xl">
        <div class="card-body">

            <div class="mb-5 flex flex-col items-center gap-2 ">
                <img src="./assets/github-logo.png" alt="">
                <h2 class="text-2xl font-bold">Github Issue Tracker</h2>
                <p>Sign in to manage your issues</p>
            </div>

          <fieldset class="fieldset">
            <label class="label font-bold ">User Name</label>
            <input id="userName" type="text" class="input w-full" placeholder="Enter user name" />
            <label class="label font-bold ">Password</label>
            <input id="password" type="password" class="input w-full" placeholder="Password" />
            <button onclick="checkUser()" id="signInButton" class="btn btn-neutral mt-4">Sign In</button>
          </fieldset>

            <div class="divider">OR</div>

            <div class="text-center bg-slate-100 p-5">
                <small><u>Demo Credentials</u></small>
                <h5 class="font-semibold mt-2">User Name : <small>admin</small></h5>
                <h5 class="font-semibold">Password : <small>admin123</small></h5>
            </div>
        </div>
      </div>
    </section>



    <script src="script/login.js"></script>
  </body>
</html>
